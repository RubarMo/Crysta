<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Crysta Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <div id="toolbar">
    <!-- History Group -->
    <div class="btn-group">
      <button type="button" class="toolbar-btn" data-command="undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>
      <button type="button" class="toolbar-btn" data-command="redo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg>
      </button>
    </div>

    <div class="separator"></div>

    <!-- Text Style Group -->
    <div class="btn-group">
      <button type="button" class="toolbar-btn" data-command="bold" title="Bold (Ctrl+B)">
        <span class="text-icon bold-icon">B</span>
      </button>
      <button type="button" class="toolbar-btn" data-command="italic" title="Italic (Ctrl+I)">
        <span class="text-icon italic-icon">I</span>
      </button>
      <button type="button" class="toolbar-btn" data-command="underline" title="Underline (Ctrl+U)">
        <span class="text-icon underline-icon">U</span>
      </button>
      <button type="button" class="toolbar-btn" data-command="strikeThrough" title="Strikethrough">
        <span class="text-icon strike-icon">S</span>
      </button>
    </div>

    <div class="separator"></div>

    <!-- Headings & Structure -->
    <div class="btn-group">
      <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h1" title="Heading 1">
        <span class="text-icon">H1</span>
      </button>
      <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="h2" title="Heading 2">
        <span class="text-icon">H2</span>
      </button>
      <button type="button" class="toolbar-btn" data-command="insertUnorderedList" title="Bulleted List">
        <svg viewBox="0 0 24 24"><path d="M4 10.5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5 1.5-.67 1.5-1.5-.67-1.5-1.5-1.5zm0-6c-.83 0-1.5.67-1.5 1.5S3.17 7.5 4 7.5 5.5 6.83 5.5 6 4.83 4.5 4 4.5zm0 12c-.83 0-1.5.68-1.5 1.5s.68 1.5 1.5 1.5 1.5-.68 1.5-1.5-.67-1.5-1.5-1.5zM7 19h14v-2H7v2zm0-6h14v-2H7v2zm0-8v2h14V5H7z"/></svg>
      </button>
      <button type="button" class="toolbar-btn" data-command="insertOrderedList" title="Numbered List">
        <svg viewBox="0 0 24 24"><path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/></svg>
      </button>
      <button type="button" class="toolbar-btn" data-command="formatBlock" data-value="blockquote" title="Quote Block">
        <svg viewBox="0 0 24 24"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"/></svg>
      </button>
    </div>

    <div class="separator"></div>

    <!-- Alignment Group -->
    <div class="btn-group">
      <button type="button" class="toolbar-btn" data-command="justifyRight" title="Align Right">
        <svg viewBox="0 0 24 24"><path d="M3 21h18v-2H3v2zm6-4h12v-2H9v2zm-6-4h18v-2H3v2zm6-4h12V7H9v2zM3 3v2h18V3H3z"/></svg>
      </button>
      <button type="button" class="toolbar-btn" data-command="justifyCenter" title="Align Center">
        <svg viewBox="0 0 24 24"><path d="M7 15v2h10v-2H7zm-4 6h18v-2H3v2zm0-8h18v-2H3v2zm4-6v2h10V7H7zM3 3v2h18V3H3z"/></svg>
      </button>
      <button type="button" class="toolbar-btn" data-command="justifyLeft" title="Align Left">
        <svg viewBox="0 0 24 24"><path d="M15 15H3v2h12v-2zm0-8H3v2h12V7zM3 13h18v-2H3v2zm0 8h18v-2H3v2zM3 3v2h18V3H3z"/></svg>
      </button>
    </div>

    <div class="separator"></div>

    <!-- Clear Formatting -->
    <div class="btn-group">
      <button type="button" class="toolbar-btn" data-command="removeFormat" title="Clear Formatting">
        <svg viewBox="0 0 24 24"><path d="M3.27 5L2 6.27l6.97 6.97L6.5 19h3l1.57-3.66L16.73 21 18 19.73 3.27 5zM6 5v.18L8.82 8h2.4l-.72 1.68 2.1 2.1L14.21 8H20V5H6z"/></svg>
      </button>
    </div>
  </div>

  <div id="editor-container">
    <div id="editor" contenteditable="true" dir="auto" spellcheck="true" data-placeholder=""></div>
  </div>
  <div id="mention-popup" role="listbox" aria-label="Mentions autocomplete"></div>
  <script src="editor.js"></script>
</body>
</html>
