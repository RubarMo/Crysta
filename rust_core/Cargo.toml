[package]
name = "rust_core"
version = "3.0.0"
edition = "2021"

[lib]
name = "rust_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flutter_rust_bridge = "=2.0.0"
docx-rs = "0.4.15"
