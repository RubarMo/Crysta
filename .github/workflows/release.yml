name: "Publish Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            # On macOS, build ONLY the .app bundle to avoid the AppleScript Finder/DMG packaging error
            args: "--bundles app"
          - platform: "ubuntu-22.04"
            # On Linux, build all packages (.deb, .rpm, .AppImage)
            args: ""
          - platform: "windows-latest"
            # On Windows, build MSI and NSIS installers (.exe)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build and Publish Release
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Crysta v__VERSION__"
          releaseBody: "Automated build for Crysta version v__VERSION__."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package DMG (macOS only)
        if: matrix.platform == 'macos-latest'
        run: |
          hdiutil create -volname "Crysta" -srcfolder src-tauri/target/release/bundle/macos/Crysta.app -ov -format UDZO Crysta.dmg

      - name: Upload DMG to Release (macOS only)
        if: matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Crysta.dmg
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
